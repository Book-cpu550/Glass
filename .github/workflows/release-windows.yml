name: Build and release Glass for Windows
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: glass-windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Electron runtime
        run: node node_modules/electron/install.js
      - name: Fetch and verify pinned native runtimes
        shell: pwsh
        run: |
          foreach ($directory in @('octave-11.3.0', 'python-3.15.2')) {
            $target = Join-Path (Get-Location) "runtimes/$directory"
            $manifest = Get-Content "$target/GLASS-RUNTIME.json" -Raw | ConvertFrom-Json
            $archive = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileName(([Uri]$manifest.source).AbsolutePath))
            Invoke-WebRequest -Uri $manifest.source -OutFile $archive
            if ((Get-Item $archive).Length -ne $manifest.bytes) { throw "Archive size mismatch: $directory" }
            if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $manifest.sha256) { throw "Archive checksum mismatch: $directory" }
            if ($directory -like 'octave-*') {
              $extract = Join-Path $env:RUNNER_TEMP 'glass-octave-extracted'
              7z x $archive "-o$extract" -y -bsp0 | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'Octave extraction failed' }
              Get-ChildItem (Join-Path $extract 'octave-11.3.0-w64') -Force | Copy-Item -Destination $target -Recurse -Force
            } else {
              Expand-Archive -LiteralPath $archive -DestinationPath $target -Force
            }
          }
          node -e "const fs=require('node:fs'),{verify}=require('./bundle-matlab-runtime.cjs');for(const n of ['octave-11.3.0','python-3.15.2']){const p='runtimes/'+n;if(!verify(p,JSON.parse(fs.readFileSync(p+'/GLASS-RUNTIME.json','utf8'))))throw Error('Runtime verification failed: '+n)}"
      - name: Run unit tests
        run: npm test
      - name: Package portable application
        run: npm run package
      - name: Check packaged equation and PDF workflows
        shell: pwsh
        run: |
          $env:MATHDESK_TEST_ASAR = (Resolve-Path release/Glass-win32-x64/resources/app.asar).Path
          node test/pdf-doubleprime-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'PDF regression check failed' }
          (Get-Content test/ai-equation-preview-smoke.cjs -Raw).Replace("C:/Users/booke/Documents/Codex/2026-11-22/che/work/ai-equation-preview.png", (Join-Path $env:RUNNER_TEMP "ai-equation-preview.png").Replace("\", "/")) | Set-Content test/ai-equation-preview-smoke.cjs
          node test/ai-equation-preview-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'AI equation regression check failed' }
      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work | Out-Null
          @'
          const path=require('node:path');
          const root=path.resolve(__dirname,'..'),version=require('../package.json').version;
          const stub=path.join(root,'release','installer','Glass-Setup-'+version+'.exe');
          const {WineVmManager}=require('app-builder-lib/out/vm/WineVm');
          const {UninstallerReader}=require('app-builder-lib/out/targets/nsis/nsisUtil');
          const original=WineVmManager.prototype.exec;
          WineVmManager.prototype.exec=function(file,...args){
            if(path.resolve(file)===stub)return UninstallerReader.exec(file,path.join(path.dirname(file),path.basename(file,'exe')+'__uninstaller.exe'));
            return original.call(this,file,...args);
          };
          require('electron-builder').build({prepackaged:path.join(root,'release/Glass-win32-x64'),config:require('../installer-config.cjs'),targets:require('electron-builder').Platform.WINDOWS.createTarget(['nsis'],require('builder-util').Arch.x64),publish:'never'}).catch(error=>{console.error(error);process.exitCode=1});
          '@ | Set-Content work/build-release-installer.cjs
          node work/build-release-installer.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Prepare downloads and checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Path release/downloads -Force | Out-Null
          Copy-Item LICENSE release/Glass-win32-x64/GLASS-LICENSE.txt
          Copy-Item THIRD_PARTY_NOTICES.md release/Glass-win32-x64/THIRD_PARTY_NOTICES.md
          Copy-Item "docs/RELEASE-v$version.md" release/Glass-win32-x64/ABOUT-GLASS.md
          7z a -tzip -mx=5 -mmt=4 -bsp0 "release/downloads/Glass-v$version-win32-x64.zip" ./release/Glass-win32-x64 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Portable ZIP build failed" }
          Copy-Item "release/installer/Glass-Setup-$version.exe" release/downloads/
          $checksums = Get-ChildItem release/downloads -File | Sort-Object Name | ForEach-Object { (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_.Name }
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'release/downloads/SHA256SUMS.txt'), ($checksums -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
      - name: Save verified build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Glass-Windows-downloads
          path: release/downloads/*
          compression-level: 0
      - name: Publish completed version as latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw "Release $tag is already published. Refusing to replace it." }
            gh release upload $tag (Get-ChildItem release/downloads -File | ForEach-Object FullName) --clobber
          } else {
            gh release create $tag (Get-ChildItem release/downloads -File | ForEach-Object FullName) --draft --title "Glass $tag" --notes-file "docs/RELEASE-$tag.md" --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed. The release was not published.' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
